<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eef0f3">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="후방견인">
<title>후방견인절차 조회 | 인천국제공항</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#eef0f3; --card:#ffffff; --line:#e7e9ee; --line-soft:#f0f2f5;
    --ink:#16181c; --ink-sub:#5c6470; --ink-mut:#9aa1ab;
    --accent:#0f6e56; --accent-soft:#e1f5ee; --accent-border:#bfe8d9;
    --btn-bg:#17191d; --btn-text:#ffffff;
    --badge:#17191d; --badge-text:#ffffff;
    --amber-t:#8a5a00; --amber-bg:#fbf3e2; --amber-bd:#ecd9a8;
    --red-t:#b42318; --red-bg:#fdf0ef; --red-bd:#f3d2ce; --red-body:#7a2620;
    --shadow:0 1px 2px rgba(20,24,32,.05), 0 4px 14px rgba(20,24,32,.05);
    --radius:18px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html[data-theme="dark"]{
    --bg:#101214; --card:#1b1e23; --line:#2a2e35; --line-soft:#23262c;
    --ink:#e9ecef; --ink-sub:#aab2bc; --ink-mut:#6b7480;
    --accent:#5dcaa5; --accent-soft:#15332a; --accent-border:#265546;
    --btn-bg:#e9ecef; --btn-text:#16181c;
    --badge:#2a2e35; --badge-text:#e9ecef;
    --amber-t:#e2b25c; --amber-bg:#2a2418; --amber-bd:#54462a;
    --red-t:#f08a80; --red-bg:#2c1a18; --red-bd:#553029; --red-body:#e0a9a2;
    --shadow:none;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);
    padding-bottom:calc(64px + var(--safe-bottom));
    letter-spacing:-0.01em;
    transition:background .25s,color .25s;
  }
  header{
    background:var(--card);
    padding:calc(12px + var(--safe-top)) 18px 12px;
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line-soft);
  }
  .logoChip{
    width:34px;height:34px;border-radius:10px;background:var(--btn-bg);color:var(--btn-text);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand{font-size:16px;font-weight:800;letter-spacing:-0.02em;}
  .brand small{display:block;font-size:10px;font-weight:600;color:var(--ink-mut);letter-spacing:.08em;}
  #themeBtn{
    margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;
    color:var(--ink-sub);padding:8px 14px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;
  }
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px;}
  .hello{margin:4px 2px 16px;}
  .hello h2{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  .hello p{font-size:13.5px;color:var(--ink-sub);margin-top:4px;line-height:1.5;}
  .gpsBtn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:16px;
    padding:15px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:transform .1s;
  }
  .gpsBtn:active{transform:scale(.98);}
  #gpsStatus{font-size:12px;color:var(--ink-mut);text-align:center;margin-top:8px;line-height:1.5;}
  #gpsBanner{
    display:none;background:var(--accent-soft);border:1px solid var(--accent-border);
    border-radius:var(--radius);padding:14px 16px;margin-top:10px;
  }
  #gpsBanner .t{font-size:12px;color:var(--ink-sub);}
  #gpsBanner .g{font-size:19px;font-weight:800;color:var(--ink);margin:3px 0 10px;letter-spacing:-0.02em;}
  #gpsCands{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .candBtn{
    display:flex;align-items:center;justify-content:space-between;width:100%;
    background:var(--card);border:1px solid var(--accent-border);border-radius:12px;
    padding:12px 16px;font-size:16px;font-weight:700;color:var(--ink);
    font-family:inherit;cursor:pointer;transition:transform .1s;
  }
  .candBtn:active{transform:scale(.98);}
  .candBtn.first{background:var(--accent);border-color:var(--accent);color:#fff;}
  .candBtn .cd{font-size:12.5px;font-weight:600;opacity:.75;}
  .numDisp{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px;text-align:center;font-size:28px;font-weight:800;letter-spacing:.14em;
    color:var(--ink);margin-top:14px;min-height:62px;display:flex;align-items:center;justify-content:center;
  }
  .numDisp.empty{color:var(--ink-mut);font-size:15px;font-weight:500;letter-spacing:0;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px;}
  .key{
    background:var(--card);border:none;border-radius:16px;box-shadow:var(--shadow);
    padding:17px 0;text-align:center;font-size:21px;font-weight:700;color:var(--ink);
    cursor:pointer;font-family:inherit;transition:transform .1s;
  }
  .key:active{transform:scale(.95);}
  .key.alt{color:var(--amber-t);}
  .key.del{color:var(--ink-mut);font-size:18px;}
  .subT{font-size:12px;font-weight:600;color:var(--ink-mut);margin:16px 2px 8px;}
  .matchRow{display:flex;flex-wrap:wrap;gap:8px;}
  .mchip{
    background:var(--accent-soft);border:1px solid var(--accent-border);color:var(--accent);
    border-radius:12px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer;
  }
  .tabs{display:flex;gap:7px;overflow-x:auto;margin:4px 0;padding-bottom:4px;}
  .tab{
    flex-shrink:0;background:var(--card);border:none;box-shadow:var(--shadow);border-radius:18px;
    padding:9px 15px;font-size:13px;font-weight:600;color:var(--ink-sub);cursor:pointer;
  }
  .tab.on{background:var(--btn-bg);color:var(--btn-text);}
  .zoneBtn{
    width:100%;background:none;border:none;color:var(--ink-sub);font-family:inherit;
    font-size:13px;font-weight:600;padding:18px 0 4px;cursor:pointer;
  }
  #zoneView{display:none;}
  .zone{display:flex;align-items:center;gap:8px;margin:16px 2px 10px;}
  .zone .zt{font-size:13px;font-weight:700;color:var(--ink-sub);}
  .zone .zl{flex:1;height:1px;background:var(--line);}
  .zone .zc{font-size:11px;color:var(--ink-mut);font-weight:500;}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .chip{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    padding:15px 0;text-align:center;font-size:16px;font-weight:700;color:var(--ink);
    cursor:pointer;transition:transform .1s;
  }
  .chip:active{transform:scale(.95);}
  .chip.special{background:var(--amber-bg);color:var(--amber-t);}
  .noresult{text-align:center;color:var(--ink-mut);font-size:14px;padding:36px 0;}
  #detail{display:none;animation:slidein .18s ease-out;}
  @keyframes slidein{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:none;}}
  .navBar{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    position:sticky;top:calc(58px + var(--safe-top));z-index:15;
    margin:0 -16px 8px;padding:8px 16px;background:var(--bg);
    border-bottom:1px solid transparent;transition:box-shadow .2s,border-color .2s;
  }
  .navBar.stuck{border-bottom-color:var(--line);box-shadow:0 4px 12px rgba(20,24,32,.06);}
  html[data-theme="dark"] .navBar.stuck{box-shadow:0 4px 12px rgba(0,0,0,.35);}
  .back{
    display:inline-flex;align-items:center;gap:5px;background:none;border:none;
    color:var(--ink-sub);font-size:14px;font-weight:600;font-family:inherit;
    padding:0;cursor:pointer;
  }
  .navArrows{display:flex;gap:7px;}
  .navBtn{
    background:var(--card);border:none;box-shadow:var(--shadow);border-radius:12px;
    padding:8px 13px;font-size:13.5px;font-weight:700;color:var(--ink);
    font-family:inherit;cursor:pointer;transition:transform .1s;
  }
  .navBtn:active{transform:scale(.95);}
  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;margin-bottom:12px;
  }
  .gateHead{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line-soft);margin-bottom:6px;}
  .gateHead.bare{padding-bottom:0;border-bottom:none;margin-bottom:0;}
  .gateBadge{
    min-width:64px;height:64px;border-radius:16px;background:var(--badge);color:var(--badge-text);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;letter-spacing:-0.02em;padding:0 10px;
  }
  .gateHead .zn{font-size:13px;color:var(--ink-mut);font-weight:500;}
  .gateHead .nm{font-size:17px;font-weight:800;margin-top:2px;letter-spacing:-0.02em;}
  .row{display:flex;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:15px;}
  .row:last-child{border-bottom:none;padding-bottom:2px;}
  .row .k{width:92px;flex-shrink:0;color:var(--ink-mut);font-size:13px;font-weight:500;}
  .row .v{font-weight:600;line-height:1.45;}
  .row .v.freq{color:var(--accent);font-weight:700;}
  .secT{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--ink);margin-bottom:14px;letter-spacing:-0.01em;}
  .secT .icChip{
    width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .steps{list-style:none;}
  .steps li{display:flex;gap:12px;padding-bottom:14px;position:relative;}
  .steps li:last-child{padding-bottom:0;}
  .steps li:not(:last-child)::before{
    content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line-soft);
  }
  .stepN{
    width:26px;height:26px;flex-shrink:0;border-radius:50%;background:var(--accent-soft);
    color:var(--accent);font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;z-index:1;
  }
  .stepT{font-size:14.5px;line-height:1.55;padding-top:3px;}
  .kw{font-weight:800;}
  .kwLegend{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px;}
  .lgd{
    display:inline-flex;align-items:center;gap:6px;background:var(--bg);
    border-radius:12px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink-sub);
  }
  .lgd i{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .kwNote{font-size:11.5px;color:var(--ink-mut);margin:-4px 0 8px;}
  .caution{background:var(--red-bg);}
  .caution .secT{color:var(--red-t);}
  .caution .secT .icChip{background:rgba(180,35,24,.1);color:var(--red-t);}
  .caution ul{list-style:none;}
  .caution li{
    font-size:14px;line-height:1.55;color:var(--red-body);padding-left:14px;position:relative;margin-bottom:6px;
  }
  .caution li:last-child{margin-bottom:0;}
  .caution li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--red-t);}
  .meta{font-size:11.5px;color:var(--ink-mut);text-align:center;margin-top:16px;line-height:1.6;}
  #mapBox svg{border-radius:12px;}
  .dwgBox{
    position:relative;width:100%;background:#161a21;border-radius:12px;overflow:hidden;
    margin-top:4px;cursor:zoom-in;
  }
  .dwgBox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .dwgBox .zoomHint{
    position:absolute;right:8px;bottom:8px;background:rgba(15,20,28,.72);color:#e8eef7;
    font-size:11px;font-weight:600;padding:5px 10px;border-radius:12px;
  }
  .lightbox{
    position:fixed;inset:0;z-index:100;background:rgba(8,10,14,.95);
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox .lbStage{
    position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox .lbStage.grabbing{cursor:grabbing;}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;}
  .lightbox .lbZoom{
    position:absolute;bottom:calc(44px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.14);
    border-radius:22px;padding:4px;backdrop-filter:blur(6px);
  }
  .lightbox .lbZoom button{
    background:none;border:none;color:#fff;font-family:inherit;font-size:15px;font-weight:800;
    padding:7px 15px;border-radius:18px;cursor:pointer;
  }
  .lightbox .lbZoom button:active{background:rgba(255,255,255,.18);}
  .lightbox .lbZoom .pct{color:#cfd8e3;font-size:12.5px;font-weight:700;min-width:46px;text-align:center;}
  .lightbox .lbClose{
    position:absolute;top:calc(12px + var(--safe-top));right:14px;
    background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:20px;
    padding:9px 16px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .lightbox .lbTip{
    position:absolute;bottom:calc(16px + var(--safe-bottom));left:0;right:0;text-align:center;
    color:#9aa8bb;font-size:12px;
  }
  .animWrap{position:relative;cursor:pointer;margin-top:4px;}
  .animWrap img{width:100%;border-radius:12px;display:block;}
  .animWrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .typePick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px;align-items:center;}
  .typePick .lb{font-size:11.5px;color:var(--ink-mut);font-weight:600;margin-right:2px;}
  .typePick button{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 12px;
    font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink-sub);cursor:pointer;}
  .typePick button.on{background:var(--btn);color:var(--btn-text);border-color:var(--btn);}
  .animWrap .hitG{cursor:pointer;}
  .animWrap .hitG .ring{animation:hitPulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
  .animWrap .hitG:active .ring{opacity:1;}
  @keyframes hitPulse{0%,100%{opacity:.35;}50%{opacity:.9;}}
  .procPick{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0 2px;}
  .procPick button{
    display:inline-flex;align-items:center;gap:6px;background:var(--card);
    border:1px solid var(--line);border-radius:18px;padding:8px 14px;
    font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;}
  .procPick button .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .procPick button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .animHint{
    position:absolute;left:10px;bottom:10px;background:rgba(15,20,28,.78);color:#e8fff4;
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:14px;
  }
  .mapLocBtn{
    width:100%;margin-top:10px;background:var(--accent-soft);border:1px solid var(--accent-border);
    color:var(--accent);border-radius:12px;padding:11px;font-size:13.5px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  .surveyBar{
    background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:var(--radius);
    padding:12px 14px;margin-top:12px;font-size:13px;font-weight:600;color:var(--amber-t);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .surveyBar button{
    background:var(--card);border:1px solid var(--amber-bd);border-radius:10px;padding:7px 12px;
    font-size:12.5px;font-weight:700;color:var(--amber-t);font-family:inherit;cursor:pointer;
  }
  .surveyCard{background:var(--amber-bg);border:1px solid var(--amber-bd);}
  .surveyCard .secT{color:var(--amber-t);}
  .surveyBtn{
    width:100%;background:var(--amber-t);color:#fff;border:none;border-radius:12px;
    padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .surveyBtn:disabled{opacity:.6;}
  .surveyInfo{font-size:12.5px;color:var(--amber-t);margin-top:8px;line-height:1.6;}
  footer{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:var(--card);border-top:1px solid var(--line-soft);
    padding:10px 16px calc(10px + var(--safe-bottom));
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--ink-mut);
  }
  footer b{font-weight:600;color:var(--ink-sub);}
</style>
</head>
<body>
<header>
  <div class="logoChip">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M12 19l-5-5M12 19l5-5"/></svg>
  </div>
  <div class="brand">후방견인절차<small>INCHEON AIRPORT · GROUND OPS</small></div>
  <button id="themeBtn" onclick="cycleTheme()">자동</button>
</header>

<div class="wrap">
  <div id="list">
    <div class="hello">
      <h2>어느 주기장인가요?</h2>
      <p>게이트 번호를 입력하면 해당 주기장의 후방견인절차가 표시됩니다.</p>
    </div>
    <div id="surveyBarWrap"></div>
    <button class="gpsBtn" onclick="findNearest()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      내 위치에서 가까운 주기장 찾기
    </button>
    <div id="gpsStatus"></div>
    <div id="gpsBanner">
      <div class="t" id="gpsTitle">현재 위치 주변 주기장 — 확인 후 선택하세요</div>
      <div id="gpsCands"></div>
    </div>
    <div id="numDisp" class="numDisp empty">게이트 번호 입력</div>
    <div class="keypad">
      <button class="key" onclick="kp('1')">1</button>
      <button class="key" onclick="kp('2')">2</button>
      <button class="key" onclick="kp('3')">3</button>
      <button class="key" onclick="kp('4')">4</button>
      <button class="key" onclick="kp('5')">5</button>
      <button class="key" onclick="kp('6')">6</button>
      <button class="key" onclick="kp('7')">7</button>
      <button class="key" onclick="kp('8')">8</button>
      <button class="key" onclick="kp('9')">9</button>
      <button class="key alt" onclick="kp('R')">R</button>
      <button class="key" onclick="kp('0')">0</button>
      <button class="key del" onclick="kpDel()" aria-label="지우기">⌫</button>
    </div>
    <div id="matchWrap"></div>
    <button class="zoneBtn" id="zoneBtn" onclick="toggleZones()">구역별 전체 보기 ▾</button>
    <div id="zoneView"><div class="tabs" id="tabs"></div><div id="chips"></div></div>
  </div>

  <div id="detail"></div>
</div>

<footer><span><b id="brandTap">인천국제공항공사</b> 운항관리처</span><span>개정 2026.07.31 · v8.1</span></footer>

<script src="gates.js"></script>
<script>
// ───────── 게이트 목록 (AIP RKSI 주기장 배치도 '26.4 기준, 검수 필요) ─────────
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>String(a+i));
const ZONE_GATES = {
 "T1": ["1","2","3", ...range(6,12), ...range(14,24), ...range(26,28), ...range(30,43), ...range(45,50)],
 "탑승동": [...range(101,115), ...range(117,119), ...range(121,132)],
 "T2": ["208","208R","209","210","211","212","213","214","214R","215","216","217","218","219","220","221","222",

function geoToXY(lat,lng){ return [GEO.ax*lat+GEO.bx*lng+GEO.cx, GEO.ay*lat+GEO.by*lng+GEO.cy]; }
// 역변환으로 지도 수록 게이트에 실좌표 부여 (GPS 최근접용)
(function(){
  const d = GEO.ax*GEO.by - GEO.bx*GEO.ay;
  Object.entries(GATE_XY).forEach(([id,[x,y]])=>{
    const g = GATES.find(t=>t.id===id); if(!g) return;
    const u = x-GEO.cx, v = y-GEO.cy;

function terminalShape(){
  const ring = range(231,268).filter(id=>GATE_XY[id]).map(id=>GATE_XY[id]);

  const cy = ring.reduce((a,p)=>a+p[1],0)/ring.length;
  const pts = ring.map(([x,y])=>[(x+(cx-x)*0.38).toFixed(1), (y+(cy-y)*0.38).toFixed(1)]);
  return `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="var(--card)" stroke="var(--line)" stroke-linejoin="round"/>`

function mapSvg(sel, user){

// 지시문의 방위·지점 키워드를 원본 도면 항공기 색으로 표시
function colorize(text, gid){
  const map = KWC[gid]; if(!map || !text) return text;
  const keys = Object.keys(map).sort((a,b)=>b.length-a.length);
  let out = text;
  keys.forEach(k=>{
    const re = new RegExp("(^|[^A-Za-z0-9])(" + k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")(?![A-Za-z0-9])", "g");
    out = out.replace(re, (m,pre,kw)=>pre+`<span class="kw" style="color:${kwHex(map[k])}">${kw}</span>`);
  });
  return out;
}

// ───────── GPS 근접 제안 ─────────
function findNearest(){
  const st = document.getElementById("gpsStatus");
  if(!navigator.geolocation){ st.textContent="이 기기는 위치 서비스를 지원하지 않습니다."; return; }
  st.textContent="위치 확인 중…";
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:la, longitude:lo, accuracy} = pos.coords;
    const ranked = GATES.filter(g=>g.lat)
      .map(g=>({g, d: dist(la,lo,g.lat,g.lng)}))
      .sort((a,b)=>a.d-b.d);
    if(!ranked.length){ st.textContent="좌표가 입력된 게이트가 없습니다."; return; }
    const cands = ranked.slice(0,3);
    document.getElementById("gpsCands").innerHTML = cands.map((c,i)=>
      `<button class="candBtn${i===0?' first':''}" onclick="openGate('${c.g.id}')">
        <span>GATE ${c.g.id} <span style="font-weight:500;font-size:13px;opacity:.8">${c.g.zone}</span></span>
        <span class="cd">약 ${Math.round(c.d)}m</span>
      </button>`).join("");
    document.getElementById("gpsBanner").style.display="block";
    st.textContent = `GPS 정확도 ±${Math.round(accuracy)}m — 실제 작업 주기장 번호와 일치하는지 확인 후 선택하세요`;
  }, err=>{ st.textContent="위치 확인 실패: 위치 권한을 허용해 주세요."; }, {enableHighAccuracy:true, timeout:8000});
}
function dist(a,b,c,d){
  const R=6371000, r=x=>x*Math.PI/180;
  const dLat=r(c-a), dLng=r(d-b);
  const h=Math.sin(dLat/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

  const baseAng = Math.atan2(cfg.pts[L-1][1]-cfg.pts[L-2][1], cfg.pts[L-1][0]-cfg.pts[L-2][0]);

    const t = Math.min((now-t0)/DUR, 1), te = t*t*(3-2*t);

  }
  animRAF=requestAnimationFrame(frame);

  const zoomAt=(cx,cy,f)=>{
    const s=st.getBoundingClientRect();
    const ox=cx-s.left-s.width/2, oy=cy-s.top-s.height/2;
    const nz=Math.min(Math.max(z*f,MIN),MAX), k=nz/z;
    tx=ox-(ox-tx)*k; ty=oy-(oy-ty)*k; z=nz; apply();
  };
  st.addEventListener("wheel",e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY, e.deltaY<0?1.18:1/1.18); },{passive:false});
  st.addEventListener("dblclick",e=>{ e.preventDefault(); z>1.2 ? (z=1,tx=0,ty=0,apply()) : zoomAt(e.clientX,e.clientY,2.5); });

  const pts=new Map(); let last=null, pinch=null;
  st.addEventListener("pointerdown",e=>{
    st.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){ last=[e.clientX,e.clientY]; st.classList.add("grabbing"); }
    if(pts.size===2){ const v=[...pts.values()];
      pinch={d:Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]), c:[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2]}; }
  });
  st.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2 && pinch){
      const v=[...pts.values()], d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);
      const c=[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2];
      if(pinch.d>0) zoomAt(c[0],c[1], d/pinch.d);
      pinch={d,c};
    } else if(pts.size===1 && last && z>1){
      tx+=e.clientX-last[0]; ty+=e.clientY-last[1]; last=[e.clientX,e.clientY]; apply();
    } else if(pts.size===1){ last=[e.clientX,e.clientY]; }
  });
  const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; if(!pts.size){ last=null; st.classList.remove("grabbing"); } };
  st.addEventListener("pointerup",up); st.addEventListener("pointercancel",up);

  lb.querySelectorAll(".lbZoom button").forEach(b=>b.onclick=()=>{
    const r=st.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    const m=b.dataset.z;
    if(m==="in") zoomAt(cx,cy,1.5);
    else if(m==="out") zoomAt(cx,cy,1/1.5);
    else { z=1; tx=0; ty=0; apply(); }
  });
  st.addEventListener("click",e=>{ if(e.target===st && z<=1.02) lb.remove(); });
  apply();
}

// ───────── 도면 내 실시간 위치 (시범: 1번 게이트 · 작업자 참고용) ─────────
const DIAG_GEO = {"1": {"lat0": 37.449719, "lng0": 126.455972, "K1": 88375.5, "K2": 110540.0, "a": 2.25918, "b": 0.21543, "tx": 356.4, "ty": 81.1, "s": 2.2694}};
let liveWatch = null;
function stopLive(){
  if(liveWatch!==null){ navigator.geolocation.clearWatch(liveWatch); liveWatch=null; }
  const b=document.getElementById("liveBtn"); if(b) b.textContent="내 위치 표시 (작업자 참고용)";
  const g=document.getElementById("liveG"); if(g) g.style.display="none";
}
function toggleLive(gid){
  const cfg=DIAG_GEO[gid];
  const btn=document.getElementById("liveBtn"), note=document.getElementById("liveNote");
  if(!cfg || !navigator.geolocation) return;
  if(liveWatch!==null){ stopLive(); if(note) note.textContent=""; return; }
  btn.textContent="위치 표시 중지";
  if(note) note.textContent="위치 수신 중…";
  liveWatch=navigator.geolocation.watchPosition(p=>{
    const xm=(p.coords.longitude-cfg.lng0)*cfg.K1, ym=(p.coords.latitude-cfg.lat0)*cfg.K2;
    const x=cfg.a*xm-cfg.b*ym+cfg.tx, y=cfg.b*xm+cfg.a*ym+cfg.ty;
    const g=document.getElementById("liveG"), dot=document.getElementById("liveDot"), acc=document.getElementById("liveAcc");
    if(!g) return;
    const inb = x>=-20&&x<=1020&&y>=-20&&y<=617;
    g.style.display = inb ? "block" : "none";
    if(inb){
      dot.setAttribute("cx",x.toFixed(1)); dot.setAttribute("cy",y.toFixed(1));
      acc.setAttribute("cx",x.toFixed(1)); acc.setAttribute("cy",y.toFixed(1));
      acc.setAttribute("r",(p.coords.accuracy*cfg.s).toFixed(1));
    }
    if(note) note.textContent = inb
      ? `파란 점=내 위치 (정확도 ±${Math.round(p.coords.accuracy)}m) — 작업자 위치 참고용이며 항공기 위치가 아닙니다`
      : "현재 위치가 이 도면 범위 밖입니다";
  }, e=>{ if(note) note.textContent="위치 오류 — 권한을 확인하세요"; }, {enableHighAccuracy:true});
}

// ───────── 측정 모드 (하단 '인천국제공항공사' 5회 연타로 토글) ─────────
let survey = false;
try{ survey = localStorage.getItem("survey")==="1"; }catch(e){}
let _tapC=0, _tapT=0;
document.getElementById("brandTap").addEventListener("click", ()=>{
  const now=Date.now();
  if(now-_tapT>2500) _tapC=0;
  _tapT=now; _tapC++;
  if(_tapC>=5){
    _tapC=0; survey=!survey;
    try{ localStorage.setItem("survey", survey?"1":"0"); }catch(e){}
    renderSurveyBar();
    alert(survey ? "측정 모드 ON — 게이트 화면에서 기준점을 기록하세요" : "측정 모드 OFF");
    goList();
  }
});
function getSurvey(){ try{ return JSON.parse(localStorage.getItem("surveyPts")||"{}"); }catch(e){ return {}; } }
function setSurvey(o){ try{ localStorage.setItem("surveyPts", JSON.stringify(o)); }catch(e){} }
function renderSurveyBar(){
  const w=document.getElementById("surveyBarWrap");
  if(!w) return;
  if(!survey){ w.innerHTML=""; return; }
  const n=Object.keys(getSurvey()).length;
  w.innerHTML = `<div class="surveyBar"><span>측정 모드 · 기록 ${n}개</span>
    <button onclick="exportSurvey()">내보내기</button>
    <button onclick="clearSurvey()">초기화</button></div>`;
}
function exportSurvey(){
  const data=JSON.stringify({type:"stand-survey", exported:new Date().toISOString(), points:getSurvey()});
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(data).then(
      ()=>alert("측정 데이터가 복사되었습니다. 메신저·메일에 붙여넣어 전달하세요."),
      ()=>prompt("아래 내용을 길게 눌러 복사하세요", data));
  } else prompt("아래 내용을 길게 눌러 복사하세요", data);
}
function clearSurvey(){ if(confirm("측정 기록을 모두 삭제할까요?")){ setSurvey({}); renderSurveyBar(); } }
let svWatch=null, svTimer=null;
function measureStart(id){
  const info=document.getElementById("svInfo"), btn=document.getElementById("svBtn");
  if(!navigator.geolocation){ info.textContent="위치 서비스 미지원"; return; }
  if(svWatch!==null){ navigator.geolocation.clearWatch(svWatch); clearTimeout(svTimer); }
  const samples=[];
  btn.disabled=true; btn.textContent="측정 중… 제자리에 서 계세요 (15초)";
  svWatch=navigator.geolocation.watchPosition(p=>{
    if(p.coords.accuracy<=25) samples.push([p.coords.latitude,p.coords.longitude,p.coords.accuracy]);
    info.textContent=`샘플 ${samples.length}개 수집 중 · 현재 정확도 ±${Math.round(p.coords.accuracy)}m`;
  }, e=>{ info.textContent="위치 오류 — 위치 권한을 확인하세요"; }, {enableHighAccuracy:true});
  svTimer=setTimeout(()=>{
    navigator.geolocation.clearWatch(svWatch); svWatch=null;
    btn.disabled=false; btn.textContent="기준점 기록 (15초 측정)";
    if(samples.length<3){ info.textContent="유효 샘플 부족 — 하늘이 트인 곳에서 다시 시도하세요"; return; }
    const lat=samples.reduce((a,x)=>a+x[0],0)/samples.length;
    const lng=samples.reduce((a,x)=>a+x[1],0)/samples.length;
    const acc=samples.reduce((a,x)=>a+x[2],0)/samples.length;
    const o=getSurvey();
    o[id]={lat:+lat.toFixed(6), lng:+lng.toFixed(6), acc:+acc.toFixed(1), n:samples.length, ts:new Date().toISOString().slice(0,16)};
    setSurvey(o);
    const g=GATES.find(x=>x.id===id); if(g){ g.lat=o[id].lat; g.lng=o[id].lng; }
    info.textContent=`저장됨 — ${o[id].lat}, ${o[id].lng} (±${o[id].acc}m · ${samples.length}샘플) · 이 휴대폰의 최근접 판정에 즉시 반영`;
    renderSurveyBar();
  }, 15000);
}
// 저장된 측정값을 좌표에 우선 적용 (측정자 휴대폰에서 즉시 개선 효과)
(function(){
  Object.entries(getSurvey()).forEach(([id,v])=>{
    const g=GATES.find(x=>x.id===id); if(g){ g.lat=v.lat; g.lng=v.lng; }
  });
})();

// ───────── QR 딥링크 (#gate=번호) ─────────
function openFromHash(){
  const m = location.hash.match(/gate=([\w]+)/);
  if(m) openGate(decodeURIComponent(m[1]));
}
window.addEventListener("load", ()=>{ applyTheme(); renderSurveyBar(); openFromHash(); });
window.addEventListener("hashchange", openFromHash);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ applyTheme(); openFromHash(); } });
applyTheme();

// PWA: 오프라인 캐시 서비스워커 등록
/* ═════════ 자동 업데이트 ═════════
   새 버전이 올라오면 다음 실행 때 자동으로 받아 적용합니다.
   앱을 지웠다 다시 설치할 필요가 없습니다. */
if ("serviceWorker" in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(refreshing) return; refreshing=true; location.reload();
  });
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg=>{
    // 새 버전이 대기 중이면 바로 적용
    if(reg.waiting) reg.waiting.postMessage("skipWaiting");
    reg.addEventListener("updatefound", ()=>{
      const sw=reg.installing;
      if(!sw) return;
      sw.addEventListener("statechange", ()=>{
        if(sw.state==="installed" && navigator.serviceWorker.controller){
          showUpdateBar(()=>sw.postMessage("skipWaiting"));
        }
      });
    });
    // 앱을 열 때마다, 그리고 화면으로 돌아올 때마다 새 버전 확인
    const check=()=>{ if(navigator.onLine) reg.update().catch(()=>{}); };
    check();
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) check(); });
    setInterval(check, 30*60*1000);
  }).catch(()=>{});
}
function showUpdateBar(apply){
  if(document.getElementById("updBar")) return;
  const b=document.createElement("div");
  b.id="updBar";
  b.innerHTML='<span>새 버전이 준비되었습니다</span><button>지금 적용</button>';
  b.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-bottom));"+
    "z-index:200;display:flex;align-items:center;gap:12px;background:var(--btn-bg);color:var(--btn-text);"+
    "border-radius:24px;padding:10px 12px 10px 18px;font-size:13.5px;font-weight:700;"+
    "box-shadow:0 6px 24px rgba(0,0,0,.25)";
  const btn=b.querySelector("button");
  btn.style.cssText="background:var(--accent);color:#fff;border:none;border-radius:18px;"+
    "padding:8px 15px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer";
  btn.onclick=()=>{ b.remove(); apply(); };
  document.body.appendChild(b);
  setTimeout(()=>{ if(document.getElementById("updBar")) { b.remove(); apply(); } }, 8000);
}
</script>
